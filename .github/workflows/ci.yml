name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eduapp
          POSTGRES_PASSWORD: eduapp_password
          POSTGRES_DB: eduapp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eduapp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Migrations apply on PostgreSQL and match the models
        env:
          DATABASE_URL: postgresql://eduapp:eduapp_password@localhost:5432/eduapp
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed

  backend-image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t eduapp-backend backend

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
